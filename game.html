<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Runner</title>

<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Orbitron',sans-serif}
  body{
    background:radial-gradient(circle at top,#0f172a,#020617);
    color:#e5e7eb;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden
  }
  .game-container{
    width:360px;
    background:#020617;
    border-radius:20px;
    box-shadow:0 0 40px #38bdf8;
    padding:15px
  }
  h1{text-align:center;color:#38bdf8;margin-bottom:10px}
  canvas{
    background:linear-gradient(#020617,#020617),
               repeating-linear-gradient(90deg,rgba(56,189,248,.15) 0 2px,transparent 2px 40px);
    border-radius:15px;
    display:block
  }
  .hud{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
    font-size:14px
  }
  .btn{
    margin-top:10px;
    width:100%;
    padding:10px;
    background:#38bdf8;
    color:#020617;
    border:none;
    border-radius:30px;
    font-weight:700;
    cursor:pointer
  }
  .btn:hover{background:#0ea5e9}
</style>
</head>
<body>

<div class="game-container">
  <h1>  NEON RUNNER - by kratika</h1>
  <canvas id="game" width="330" height="420"></canvas>
  <div class="hud">
    <div>Score: <span id="score">0</span></div>
    <div>Level: <span id="level">1</span></div>
  </div>
  <button class="btn" onclick="startGame()">START / RESTART</button>
</div>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let player,obstacles,score,level,speed,gameOver,loop;

function startGame(){
  player={x:150,y:350,w:30,h:30,dx:0};
  obstacles=[];
  score=0;level=1;speed=2;gameOver=false;
  cancelAnimationFrame(loop);
  update();
}

function update(){
  loop=requestAnimationFrame(update);
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Player
  ctx.fillStyle='#38bdf8';
  ctx.shadowColor='#38bdf8';ctx.shadowBlur=15;
  ctx.fillRect(player.x,player.y,player.w,player.h);
  ctx.shadowBlur=0;

  player.x+=player.dx;
  if(player.x<0)player.x=0;
  if(player.x+player.w>canvas.width)player.x=canvas.width-player.w;

  // Obstacles
  if(Math.random()<0.02){
    obstacles.push({x:Math.random()*300,y:-20,w:30,h:30});
  }

  ctx.fillStyle='#f43f5e';
  obstacles.forEach(o=>{
    o.y+=speed;
    ctx.fillRect(o.x,o.y,o.w,o.h);

    // Collision
    if(o.x<player.x+player.w && o.x+o.w>player.x && o.y<player.y+player.h && o.y+o.h>player.y){
      gameOver=true;
    }
  });

  obstacles=obstacles.filter(o=>o.y<canvas.height+40);

  // Score
  if(!gameOver){
    score++;
    if(score%500===0){level++;speed+=0.5;}
  } else {
    ctx.fillStyle='#fff';
    ctx.font='20px Orbitron';
    ctx.fillText('NEON FAILURE',60,200);
    ctx.fillText('RESTART REQUIRED',60,230);
    cancelAnimationFrame(loop);
  }

  document.getElementById('score').innerText=score;
  document.getElementById('level').innerText=level;
}

// Controls
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')player.dx=-4;
  if(e.key==='ArrowRight')player.dx=4;
});
window.addEventListener('keyup',()=>player.dx=0);

startGame();
</script>
</body>
</html>
